syntax = "proto3";
option java_package = "jung.api.grpc";
option java_outer_classname = "UserProto";

service UserService {
  rpc GetUser (UserRequest) returns (UserResponse);
  rpc ListUsers(Empty) returns (stream UserResponse); // 서버 스트리밍
}

message UserRequest {
  int64 user_id = 1;
}

message UserResponse {
  int64 user_id = 1;
  string name = 2;
  string email = 3;
}

message Empty{}